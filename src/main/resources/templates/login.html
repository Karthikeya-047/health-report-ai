<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Sign in')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in</h1><p class="text-muted">Pick up where you left off.</p><div class="alert alert-success" th:if="${param.registered}">Account created. You can sign in now.</div><div class="alert alert-danger" th:if="${param.error}">Email or password didn't match. Try again.</div><form method="post" th:action="@{/login}"><label>Email address</label><input class="form-control mb-3" type="email" name="username" required autofocus><label>Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Sign in</button></form><p class="mt-4 text-center">New here? <a href="/register">Create an account</a></p></section></main></body></html>
