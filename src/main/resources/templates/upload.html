<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Upload a report')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container page narrow"><a href="/dashboard">← Dashboard</a><div class="eyebrow mt-4">ADD A DOCUMENT</div><h1>Upload a report</h1><p class="text-muted">Add a PDF to see its text and ask questions about it.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form class="upload-box mt-4" method="post" enctype="multipart/form-data" th:action="@{/reports/upload}"><div class="doc-icon mx-auto">↑</div><h3>Select your medical report</h3><p>PDF format · up to 10 MB</p><input class="form-control" type="file" name="file" accept="application/pdf,.pdf" required><button class="btn btn-primary mt-4">Upload PDF</button></form><div class="soft-note mt-4">Your report is stored privately with your account. Scanned documents without selectable text will be identified; OCR is not included.</div></main></body></html>
