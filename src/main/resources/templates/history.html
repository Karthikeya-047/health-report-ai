<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Conversation history')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container page narrow"><div class="eyebrow">YOUR QUESTIONS</div><h1>Conversation history</h1><p class="text-muted">Return to a previous report conversation whenever you need.</p><div th:if="${#lists.isEmpty(conversations)}" class="empty"><h3>No conversations yet</h3><p>Open a report and start a conversation.</p><a href="/dashboard" class="btn btn-primary">View reports</a></div><a th:each="c:${conversations}" class="history-row" th:href="@{'/conversations/'+${c.id}}"><div><strong th:text="${c.title}">Conversation</strong><small class="d-block text-muted" th:text="${c.report.filename}">Report</small></div><span th:text="${c.createdAt}">date</span></a></main></body></html>
