<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Report details')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container page"><a href="/dashboard">← Dashboard</a><div class="d-flex justify-content-between align-items-start mt-4"><div><div class="eyebrow">REPORT DETAILS</div><h1 th:text="${report.filename}">Report</h1><p class="text-muted" th:text="'Uploaded ' + ${report.uploadedAt}">Date</p></div><form th:action="@{'/reports/'+${report.id}+'/chat'}" method="post"><button class="btn btn-primary">Ask about this report →</button></form></div><div class="row g-3 my-3"><div class="col-md-4"><div class="metric"><span>Pages</span><strong th:text="${report.pageCount}">0</strong></div></div><div class="col-md-8"><div class="metric"><span>Extraction</span><strong class="fs-6" th:text="${report.extractionStatus}">Ready</strong></div></div></div><section class="panel"><h2>Extracted text</h2><p class="text-muted small">Text extracted from your PDF. For scanned PDFs, image text recognition is not available.</p><pre class="extracted" th:text="${#strings.isEmpty(report.extractedText) ? 'No selectable text was found in this PDF.' : report.extractedText}">Text</pre></section></main></body></html>
