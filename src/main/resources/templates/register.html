<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layout :: head('Create account')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">A CLEARER START</div><h1>Create your account</h1><p class="text-muted">Your reports and conversations stay in your account.</p><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><form method="post" th:action="@{/register}"><label>Your name</label><input class="form-control mb-3" name="name" th:value="${name}" maxlength="100" required><label>Email address</label><input class="form-control mb-3" type="email" name="email" th:value="${email}" required><label>Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" maxlength="72" required><button class="btn btn-primary w-100">Create account</button></form><p class="mt-4 text-center">Already registered? <a href="/login">Sign in</a></p></section></main></body></html>
